# Archivo de configuración de plantilla, crear un config.{env}.toml para cada env que quieras (dev, prod, xxx)
[server]
    HOST = "localhost"
    VERSION = '1.0.0'
    PORT = 8300
    DEBUG = false
    CORS_URLS = ["localhost", "0.0.0.0", "192.168.100.84"]
    RESTRICTED_MODULES = []

[secrets]
    SECRET_KEY = "123456"

[database]
    DB_TYPE = "sqlite3"
    DB_DRIVER = "..."
    DB_USER = "..."
    DB_PASSWORD = "..."
    DB_HOST = "localhost"
    DB_PORT = 5432
    DB_NAME = "db.sqlite3"

[logs]
    LOGS_LEVEL = 10
    LOGS_FILE = "app.log"
    LOGS_DIR = "logs"
    LOGS_FORMAT = "[%(levelname)s] -> [%(asctime)s]: %(message)s"
    LOGS_DATE_FORMAT = "%Y-%m-%d %H:%M"

[auth]
    ENABLED = true
    TOKEN_TTL_MINUTES = 1440
    TOKEN_SALT = "auth-token"
    SESSION_COOKIE_NAME = "session"
    SESSION_MAX_AGE_SECONDS = 86400
    SESSION_SAME_SITE = "lax"
    SESSION_HTTPS_ONLY = false

    [auth.OAUTH]
        ENABLED = false
        PROVIDER = "generic"
        CLIENT_ID = ""
        CLIENT_SECRET = ""
        AUTHORIZE_URL = ""
        TOKEN_URL = ""
        USERINFO_URL = ""
        REDIRECT_URI = "http://localhost:8300/auth/oauth/callback"
        SCOPES = ["openid", "email", "profile"]
        USE_PKCE = true

    # Header-based authentication: Authorization: Bearer <access-token>
    # Keep this disabled until the realm and API client are configured.
    [auth.KEYCLOAK]
        ENABLED = false
        URL = "http://localhost:8080"
        REALM = "master"
        CLIENT_ID = "api"
        CLIENT_SECRET = ""
        VERIFY = true
        AUTHENTICATION_SCHEME = "Bearer"
        VALIDATE_TOKEN = true
        REJECT_ON_MISSING_CLAIM = false
        CLAIMS = [
            "sub",
            "name",
            "family_name",
            "given_name",
            "preferred_username",
            "email",
            "email_verified",
            "iss",
            "aud",
            "azp",
            "realm_access",
            "resource_access",
            "groups",
            "scope",
            "permissions",
        ]
        EXCLUDE_PATTERNS = ["^/$", "^/health$", "^/docs$", "^/openapi.json$", "^/redoc$"]
        ADD_SWAGGER_AUTH = false
        SWAGGER_CLIENT_ID = ""
