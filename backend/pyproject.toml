[project]
name = "fastapi-completo-productivo"
version = "0.0.1"
authors = [{name = "Nicolas Agustin Pieroni", email = "pieroni.nico@gmail.com"}]
description = "----"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "cachetools>=7.1.4",
    "fastapi>=0.136.1",
    "fastapi-keycloak-middleware>=1.6.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jwcrypto>=1.5.8,<2",
    "pydantic>=2.13.4",
    "python-keycloak>=7.1.1",
    "rich>=13,<15",
    "ruamel.yaml>=0.18,<1",
    "sqlalchemy[asyncio]>=2.0.49",
    "sqlmodel>=0.0.49",
    "tomli>=2,<3",
    "tomlkit>=0.12,<1",
    "typer>=0.12,<1",
    "uvicorn>=0.47.0",
]

[project.scripts]
crear-dummy-db = "arranque_datos_prueba:ejecutar"
asignar-rol = "asignar_rol:ejecutar"
listar-usuarios = "listar_usuarios:ejecutar"
listar-roles = "listar_roles:ejecutar"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoconfig*", "dummy_db*", "db*", "models*", "services*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
