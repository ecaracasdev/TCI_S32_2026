<header class="header">
    <div class="header-container">
        <a class="brand" [routerLink]="config.brand.homeUrl" (click)="closeMenu()">
            <span class="brand-mark" aria-hidden="true">N</span>
            {{ config.brand.name }}
        </a>

        <button
            class="menu-toggle"
            type="button"
            [attr.aria-expanded]="isMenuOpen()"
                aria-label="Abrir menú"
            (click)="toggleMenu()"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav" [class.nav-open]="isMenuOpen()">
            @for (item of config.navigation; track item.label) {
                <a class="nav-link" [routerLink]="item.href" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: item.href === '/' }" (click)="closeMenu()">
                    {{ item.label }}
                </a>
            }
        </nav>
        <div class="header-user" aria-label="Usuario conectado"><span class="user-avatar">NM</span><span class="user-name">Nicolás M.</span></div>
    </div>
</header>
