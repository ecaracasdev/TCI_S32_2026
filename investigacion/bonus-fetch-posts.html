<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonus - Primeros cinco posts</title>
    <style>
      body {
        background: #f4f8fa;
        color: #173042;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 32px 16px;
      }

      main {
        background: white;
        border: 1px solid #d9e2ea;
        border-radius: 12px;
        margin: 0 auto;
        max-width: 720px;
        padding: 24px;
      }

      h1 {
        margin-top: 0;
      }

      button {
        background: #176c6f;
        border: 0;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        padding: 10px 14px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #estado {
        color: #536674;
        min-height: 24px;
      }

      li {
        border-bottom: 1px solid #e4ebef;
        padding: 12px 0;
      }

      li:last-child {
        border-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Primeros cinco posts</h1>
      <p>Bonus de la actividad de JavaScript asincrónico y <code>fetch</code>.</p>
      <button id="cargar-posts" type="button">Cargar posts</button>
      <p id="estado" aria-live="polite"></p>
      <ul id="lista-posts"></ul>
    </main>

    <script>
      const boton = document.querySelector('#cargar-posts');
      const estado = document.querySelector('#estado');
      const lista = document.querySelector('#lista-posts');

      boton.addEventListener('click', async () => {
        boton.disabled = true;
        estado.textContent = 'Cargando...';
        lista.replaceChildren();

        try {
          const respuesta = await fetch('https://jsonplaceholder.typicode.com/posts');

          if (!respuesta.ok) {
            throw new Error(`Error HTTP: ${respuesta.status}`);
          }

          const posts = await respuesta.json();

          posts.slice(0, 5).forEach((post) => {
            const item = document.createElement('li');
            const titulo = document.createElement('strong');

            titulo.textContent = `${post.id}. ${post.title}`;
            item.appendChild(titulo);
            lista.appendChild(item);
          });

          estado.textContent = 'Se cargaron los primeros cinco títulos.';
        } catch (error) {
          estado.textContent = `No se pudieron cargar los posts: ${error.message}`;
        } finally {
          boton.disabled = false;
        }
      });

      if (new URLSearchParams(window.location.search).has('evidencia')) {
        boton.click();
      }
    </script>
  </body>
</html>
