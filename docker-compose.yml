services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tci
      POSTGRES_DB: tci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copiá .env.example a .env y completalo (ver README)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tci -d tci"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8300:8300"
    volumes:
      # Misma configuración que config.toml, pero con la base en el servicio db.
      - ./backend/config.docker.toml:/app/config.toml:ro
    environment:
      # La clave de auth es opcional salvo que se use el OAuth genérico.
      AUTOCONFIG_SECRETS__AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      AUTOCONFIG_SECRETS__SECRET_KEY: ${SECRET_KEY:-}
      AUTOCONFIG_SECRETS__CLAVE_JWT: ${CLAVE_JWT:?Falta CLAVE_JWT. Copiá .env.example a .env y completalo (ver README)}
      AUTOCONFIG_DATABASE__DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copiá .env.example a .env y completalo (ver README)}
      AUTOCONFIG_AUTH__JWT__HABILITADO: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
