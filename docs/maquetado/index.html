<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar incidencia — Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p>Sistema de Gestión de Stock y Mantenimiento de Planta</p>
        <a class="volver" href="home.html">&larr; Inicio</a>
    </header>
    <main>
        <h1>Reportar incidencia</h1>
        <form class="formulario" id="form-incidencia">
           <label for="maquina">Máquina:</label>
           <input type="text" id="maquina" name="maquina" placeholder="Código QR de la máquina">

           <!-- B2: segundo campo de máquina, listo para escaneo QR real en M3 -->
           <label for="codigo-maquina">Escanear código QR:</label>
           <div class="campo-con-boton">
               <input type="text" id="codigo-maquina" name="codigo-maquina" placeholder="Se completa automáticamente al escanear">
               <button type="button" id="btn-escanear" class="boton-secundario">📷 Escanear</button>
           </div>

           <label for="descripcion">Descripción:</label>
           <textarea id="descripcion" name="descripcion" placeholder="Describí el problema que observaste…"></textarea>

           <label for="foto">Foto:</label>
           <input type="file" id="foto" name="foto" accept="image/*">
           <span id="foto-nombre" class="archivo-nombre">Sin archivo seleccionado</span>

           <label for="turno">Turno:</label>
           <select id="turno" name="turno">
               <option value="manana">Mañana</option>
               <option value="tarde">Tarde</option>
               <option value="noche">Noche</option>
           </select>

           <div class="acciones">
               <input type="submit" id="btn-enviar" name="btn-enviar" value="Reportar">
               <button type="button" id="btn-limpiar" class="boton-texto">Limpiar</button>
           </div>
        </form>
        <div id="preview-incidencia" hidden></div>
    </main>
    <footer>
        <p>footer</p>
    </footer>
    <script src="app.js" defer></script>
</body>
</html>
